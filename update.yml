name: Update gold rate
on:
  schedule: [{cron: "45 4 * * *"}]   # 10:15 AM IST daily
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update_rate.py
      - run: |
          git config user.name "rate-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/rates.json; git diff --cached --quiet || git commit -m "Update rate"; git push
